name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: askwh
          POSTGRES_PASSWORD: askwh
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askwh -d warehouse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://askwh:askwh@localhost:5432/warehouse
      EVAL_DATABASE_URL: postgresql://askwh:askwh@localhost:5432/warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      # Free evaluation layer: every expected metric request must reproduce its reference SQL.
      - run: uv run askwh-eval check
      # The committed records must still produce the committed report.
      - run: uv run askwh-eval report | diff - results/report.md
