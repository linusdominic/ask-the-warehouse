services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askwh
      POSTGRES_PASSWORD: askwh
      POSTGRES_DB: warehouse
    ports:
      - "5436:5432" # 5436 on the host, clear of other local databases
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askwh -d warehouse"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://askwh:askwh@db:5432/warehouse
      READONLY_DATABASE_URL: postgresql://askwh_ro:askwh_ro@db:5432/warehouse
    ports:
      - "8010:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/health")
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
