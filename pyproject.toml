[project]
name = "askwh"
version = "0.1.0"
description = "Governed, near-real-time answers to plain-language business questions, in place of dashboards."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Linus Dominic Nathaniel", email = "51094161+linusdominic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.33.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
askwh = "askwh.main:serve"
askwh-seed = "askwh.seed:main"
askwh-eval = "askwh.evals.runner:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
